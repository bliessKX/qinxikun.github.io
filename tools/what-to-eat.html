<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今天吃什么 · 转盘</title>
<meta name="description" content="按当前时间判断早餐、午餐、晚餐，再选中餐、西餐、马来西亚餐或别的国家，转一下就知道吃什么。">
<meta name="theme-color" content="#fbf7ec">
<style>
:root{
  --paper:#fbf7ec;
  --card:#fffdf6;
  --ink:#23201b;
  --muted:#7d7568;
  --hair:#ded6c4;
  --accent:#d8452f;
  --accent-2:#3e8e5b;
  --accent-ink:#fffdf6;
  --line:2px solid var(--ink);
  --shadow:5px 5px 0 var(--ink);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
}
body[data-meal="breakfast"]{--accent:#dd7926;--accent-2:#e6b93c}
body[data-meal="lunch"]{--accent:#d8452f;--accent-2:#3e8e5b}
body[data-meal="dinner"]{--accent:#3a5f91;--accent-2:#d5902f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;
  background-color:var(--paper);
  background-image:radial-gradient(rgba(35,32,27,.075) .7px,transparent .8px);
  background-size:17px 17px;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 26px}

/* 顶栏：细线，不做大色块 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:20px 0 16px;border-bottom:var(--line)}
.brand{font-size:19px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}
.brand i{font-style:normal;color:var(--accent)}
.back{font-size:13px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--hair);padding-bottom:2px}
.back:hover{color:var(--ink);border-color:var(--ink)}
.topnav{display:flex;align-items:center;gap:16px}
.clock{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock small{font-weight:600;color:var(--muted);font-size:12px;margin-right:7px}

/* 时段横幅：唯一的大色块，颜色跟时段走 */
.meal-banner{
  display:flex;align-items:center;gap:17px;
  margin:26px 0 34px;padding:16px 20px;
  background:var(--accent);color:var(--accent-ink);
  border:var(--line);border-radius:9px;box-shadow:var(--shadow);
}
.meal-symbol{
  flex:0 0 48px;width:48px;height:48px;border-radius:50%;
  border:2px solid var(--accent-ink);display:grid;place-items:center;
  font-size:23px;line-height:1;
}
.meal-title{font-size:19px;font-weight:900;letter-spacing:-.01em;line-height:1.3}
.meal-sub{font-size:12.5px;opacity:.88;margin-top:2px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:46px;align-items:start;padding-bottom:56px}

/* 转盘 */
.wheel-col{text-align:center}
.wheel-frame{position:relative;width:min(410px,100%);aspect-ratio:1;margin:8px auto 0}
.wheel-rotor{
  width:100%;height:100%;
  transition:transform 5.2s cubic-bezier(.12,.71,.11,1);
  will-change:transform;
}
.wheel-rotor canvas{width:100%;height:100%;display:block}
.pointer{
  position:absolute;left:50%;top:-9px;transform:translateX(-50%);z-index:3;
  width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;
  border-top:27px solid var(--ink);
}
.pointer::after{
  content:"";position:absolute;left:-9px;top:-25px;
  width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;
  border-top:16px solid var(--accent);
}
.spin-btn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:92px;height:92px;border-radius:50%;
  border:var(--line);background:var(--card);color:var(--ink);
  font-size:23px;font-weight:900;letter-spacing:.02em;line-height:1;
  box-shadow:var(--shadow);cursor:pointer;
}
.spin-btn:hover{background:var(--accent);color:var(--accent-ink)}
.spin-btn:active{transform:translate(-50%,-50%) translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.spin-btn:disabled{cursor:default;background:var(--card);color:var(--muted)}
.spin-btn:focus-visible,.chip:focus-visible,.link-btn:focus-visible,.again:focus-visible,.back:focus-visible{
  outline:3px solid var(--accent-2);outline-offset:3px;
}
.wheel-hint{font-size:13px;color:var(--muted);margin:20px 0 0}

/* 右侧面板 */
.panel-block{margin-bottom:26px}
.panel-block h2{
  font-size:12px;font-weight:800;letter-spacing:.06em;margin:0 0 11px;
  color:var(--muted);
}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  border:var(--line);background:var(--card);color:var(--ink);
  padding:7px 13px;border-radius:6px;font-size:13.5px;font-weight:700;
  box-shadow:2px 2px 0 var(--ink);cursor:pointer;line-height:1.4;
}
.chip:hover{background:#f3ecdc}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:2px 2px 0 var(--ink)}
.chip[aria-pressed="true"]:hover{filter:brightness(.94)}
.pool-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.pool-head h2{margin:0}
.link-btn{
  all:unset;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--accent);
  border-bottom:1px solid currentColor;padding-bottom:1px;white-space:nowrap;
}
.link-btn:hover{color:var(--ink)}
.pool-list{
  display:flex;flex-wrap:wrap;gap:6px;
  border-top:1px solid var(--hair);padding-top:12px;
}
.pool-list span{
  font-size:12px;color:var(--muted);background:var(--card);
  border:1px solid var(--hair);border-radius:4px;padding:3px 8px;
}
.result{
  background:var(--card);border:var(--line);border-radius:9px;box-shadow:var(--shadow);
  padding:20px 22px 22px;
}
.result-label{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--muted)}
.result-name{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.3;margin:6px 0 4px;word-break:break-all}
.result-meta{font-size:13px;color:var(--muted)}
.result.hit{background:var(--accent);color:var(--accent-ink);animation:pop .34s cubic-bezier(.2,.9,.3,1.2)}
.result.hit .result-label,.result.hit .result-meta{color:var(--accent-ink);opacity:.85}
.again{
  display:none;margin-top:15px;border:var(--line);border-radius:6px;
  background:var(--card);color:var(--ink);font-size:13px;font-weight:800;
  padding:7px 14px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);
}
.result.hit .again{display:inline-block}
.again:hover{background:#f3ecdc}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:scale(1);opacity:1}}

footer{border-top:1px solid var(--hair);padding:18px 0 34px;font-size:12.5px;color:var(--muted)}
footer a{border-bottom:1px solid var(--hair);font-weight:700}
footer a:hover{color:var(--ink);border-color:var(--ink)}

@media(max-width:860px){
  .wrap{padding:0 18px}
  .stage{grid-template-columns:1fr;gap:30px}
  .wheel-frame{width:min(340px,84vw)}
  .meal-banner{margin:20px 0 28px}
  .panel-block{margin-bottom:22px}
  /* 窄屏隐藏次要工具链接，避免顶栏挤成两行；「全部工具」页里有完整入口 */
  .topnav .back:not(:first-child):not(:nth-child(2)){display:none}
  .topnav{gap:12px}
  .brand{font-size:17px}
}
@media(prefers-reduced-motion:reduce){
  .wheel-rotor{transition-duration:.06s}
  .result.hit{animation:none}
  .spin-btn:active{transform:translate(-50%,-50%)}
}
</style>
</head>

<div class="wrap">
  <header class="topbar">
    <div class="topnav">

        <button class="again" id="againBtn" type="button">再转一次 ↻</button>
      </div>
    </section>
  </main>

  <footer>别把午饭这件事想太复杂。 · <a href="../index.html">回去看笔记</a> · <a href="index.html">全部工具</a></footer>
</div>

<script>
(function(){
  'use strict';

  /* 菜池：每个菜系 × 早/午/晚。名字刻意压短，转盘上才排得下 */
  var MENU = {
    zh:{

    west:{

      breakfast:['班尼迪克蛋','可颂配咖啡','美式松饼','燕麦碗','培根煎蛋','法式吐司','牛油果吐司','英式全餐','酸奶杯','炒蛋吐司'],
      lunch:['凯撒沙拉','肉酱意面','汉堡薯条','鸡肉卷','蘑菇浓汤','烤鸡胸','玛格丽特披萨','总汇三明治','藜麦碗','炸鱼薯条'],
      dinner:['菲力牛排','烤羊排','海鲜意面','奶油焗饭','披萨','红酒炖牛肉','煎三文鱼','芝士焗虾','蘑菇烩饭','烤春鸡']
    },
    my:{
      name:'马来西亚餐',
      breakfast:['椰浆饭','咖椰吐司','印度煎饼','肉骨茶','炒粿条','叻沙','福建虾面','椰浆粥','半熟蛋','沙爹串'],
      lunch:['椰浆饭','亚参叻沙','炒粿条','沙爹串','海南鸡饭','咖喱叻沙','扁担饭','仁当牛肉','福建虾面','娘惹菜'],
      dinner:['肉骨茶','沙爹串','辣椒螃蟹','椰浆饭','亚参鱼','仁当牛肉','煎饼配咖喱','娘惹菜','烧烤海鲜','咖喱叻沙']
    },
    jp:{
      name:'日料',
      breakfast:['味噌汤定食','烤鲑鱼','玉子烧','纳豆饭','厚吐司','日式白粥','饭团','茶泡饭'],
      lunch:['豚骨拉面','日式咖喱饭','亲子丼','寿司拼盘','天妇罗定食','乌冬面','照烧鸡腿饭','牛丼'],
      dinner:['寿喜烧','串烧拼盘','寿司拼盘','天妇罗','鳗鱼饭','涮涮锅','刺身拼盘','烤秋刀鱼']
    },
    kr:{
      name:'韩餐',
      breakfast:['泡菜汤','海带汤','紫菜包饭','泡菜煎饼','拌饭','南瓜粥','炒年糕','酱汤配饭'],
      lunch:['石锅拌饭','部队锅','韩式炸鸡','冷面','辣炒年糕','泡菜炒饭','烤肉定食','紫菜包饭'],
      dinner:['韩式烤肉','部队锅','炸鸡配啤酒','参鸡汤','辣炖鸡','烤五花肉','泡菜汤','拌冷面']
    },
    th:{
      name:'泰餐',
      breakfast:['泰式粥','芒果糯米饭','船面','煎蛋配饭','泰式奶茶','香茅鸡汤','烤吐司'],
      lunch:['泰式炒河粉','绿咖喱饭','冬阴功配饭','打抛猪肉饭','菠萝炒饭','青木瓜沙拉','泰式炒饭','船面'],
      dinner:['冬阴功汤','咖喱蟹','泰式烤鱼','绿咖喱','芒果糯米饭','海鲜炒饭','打抛猪肉','青木瓜沙拉']
    },
    ind:{
      name:'印度餐',
      breakfast:['玛萨拉薄饼','蒸米糕','香料米片','奶茶配烤饼','鹰嘴豆饼','酸奶碗'],
      lunch:['黄油鸡配馕','香料香饭','咖喱饭','塔利套餐','玛萨拉薄饼','扁豆汤配饭','烤鸡块','菠菜奶酪'],
      dinner:['坦都里烤鸡','香料香饭','咖喱羊肉','奶酪咖喱','扁豆汤','烤饼配咖喱','香料烤鱼','奶油鸡']
    }
  };

  var MEAL_TEXT = {
    breakfast:{label:'早餐',title:'该吃早餐了',symbol:'☀'},
    lunch:{label:'午餐',title:'该吃午餐了',symbol:'◐'},
    dinner:{label:'晚餐',title:'该吃晚餐了',symbol:'☾'}
  };

  var $ = function(id){ return document.getElementById(id); };
  var canvas = $('wheel'), ctx = canvas.getContext('2d');
  var rotor = $('rotor'), spinBtn = $('spinBtn');
  var result = $('result'), resultName = $('resultName'), resultMeta = $('resultMeta');

  var state = { meal:'auto', cuisine:'all', pool:[], rotation:0, spinning:false, lastPick:-1 };

  function autoMeal(){
    var d = new Date(), h = d.getHours() + d.getMinutes()/60;
    if(h >= 5 && h < 10.5) return 'breakfast';
    if(h >= 10.5 && h < 15) return 'lunch';
    return 'dinner';
  }
  function isLateNight(){ var h = new Date().getHours(); return h >= 22 || h < 5; }
  function activeMeal(){ return state.meal === 'auto' ? autoMeal() : state.meal; }

  function cssVar(name, fallback){
    var v = getComputedStyle(document.body).getPropertyValue(name).trim();
    return v || fallback;
  }

  /* 画盘：扇区从 12 点方向顺时针排，第 i 格中心角 = -90 + (i+0.5)*seg */
  function drawWheel(items){
    var S = 400, dpr = window.devicePixelRatio || 1;
    canvas.width = S*dpr; canvas.height = S*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,S,S);

    var cx = S/2, cy = S/2, R = S/2 - 9, n = items.length, seg = 360/n;
    var ink  = cssVar('--ink','#23201b');
    var a    = cssVar('--accent','#d8452f');
    var b    = cssVar('--accent-2','#3e8e5b');
    var card = cssVar('--card','#fffdf6');
    var pal = [
      {bg:a,fg:'#fffdf6'}, {bg:card,fg:ink},
      {bg:b,fg:'#fffdf6'}, {bg:'#efe7d5',fg:ink}
    ];

    for(var i=0;i<n;i++){
      var a0 = (-90 + i*seg) * Math.PI/180;
      var a1 = (-90 + (i+1)*seg) * Math.PI/180;
      var p = pal[i % pal.length];

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,R,a0,a1);
      ctx.closePath();
      ctx.fillStyle = p.bg; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = ink; ctx.stroke();

      /* 文字保持水平正立，摆在扇区中点 —— 比径向排的字好读 */
      var mid = (a0+a1)/2;
      var r = R*0.63;
      var tx = cx + Math.cos(mid)*r, ty = cy + Math.sin(mid)*r;
      var chord = 2*r*Math.sin(Math.PI/n) - 10;
      ctx.save();
      ctx.fillStyle = p.fg;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      var name = items[i], fs = name.length >= 6 ? 12 : (name.length >= 5 ? 13 : 14.5);
      ctx.font = '700 ' + fs + 'px "PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
      ctx.fillText(name, tx, ty, chord);
      ctx.restore();
    }

    /* 外圈：粗墨环 + 12 颗轮盘灯 */
    ctx.beginPath();
    ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.lineWidth = 6; ctx.strokeStyle = ink; ctx.stroke();
    for(var j=0;j<12;j++){
      var ang = (-90 + j*30) * Math.PI/180;
      var dx = cx + Math.cos(ang)*R, dy = cy + Math.sin(ang)*R;
      ctx.beginPath();
      ctx.arc(dx,dy,4.2,0,Math.PI*2);
      ctx.fillStyle = j%2 ? card : a;
      ctx.fill();
      ctx.lineWidth = 1.6; ctx.strokeStyle = ink; ctx.stroke();
    }
  }

  function shuffle(arr){
    for(var i=arr.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=arr[i]; arr[i]=arr[j]; arr[j]=t;
    }
    return arr;
  }

  function buildPool(){
    var m = activeMeal();
    var keys = state.cuisine === 'all' ? Object.keys(MENU) : [state.cuisine];
    var all = [];
    keys.forEach(function(k){ all = all.concat(MENU[k][m]); });
    all = all.filter(function(v,i){ return all.indexOf(v) === i; });
    shuffle(all);
    state.pool = all.slice(0, Math.min(10, all.length));
    state.lastPick = -1;

    drawWheel(state.pool);
    $('poolCount').textContent = state.pool.length + ' 道候选';
    $('poolList').innerHTML = state.pool.map(function(x){
      return '<span>' + x + '</span>';
    }).join('');
    resetResult();
  }

  function resetResult(){
    result.classList.remove('hit');
    resultName.textContent = '还没转';
    resultMeta.textContent = '转一下，别纠结了';
  }

  function syncBanner(){
    var m = activeMeal();
    document.body.setAttribute('data-meal', m);
    var t = MEAL_TEXT[m];
    $('mealSymbol').textContent = t.symbol;
    if(isLateNight() && m === 'dinner'){
      $('mealTitle').textContent = '夜深了，吃点夜宵';
    }else{
      $('mealTitle').textContent = t.title;
    }
    if(state.meal === 'auto'){
      $('mealSub').textContent = '按当前时间自动判断，也可以自己切';
      $('clockTag').textContent = '现在';
    }else{
      $('mealSub').textContent = '手动选了' + t.label + ' · 当前时间建议吃' + MEAL_TEXT[autoMeal()].label;
      $('clockTag').textContent = '手动';
    }
    var d = new Date();
    $('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  }

  function refresh(){ syncBanner(); buildPool(); }

  function setPressed(container, attr, value){
    container.querySelectorAll('.chip').forEach(function(btn){
      btn.setAttribute('aria-pressed', btn.getAttribute(attr) === value ? 'true' : 'false');
    });
  }

  $('mealChips').addEventListener('click', function(e){
    var btn = e.target.closest('.chip'); if(!btn || state.spinning) return;
    state.meal = btn.getAttribute('data-meal');
    setPressed(this, 'data-meal', state.meal);
    refresh();
  });

  $('cuisineChips').addEventListener('click', function(e){
    var btn = e.target.closest('.chip'); if(!btn || state.spinning) return;
    state.cuisine = btn.getAttribute('data-cuisine');
    setPressed(this, 'data-cuisine', state.cuisine);
    buildPool();
  });

  $('reshuffle').addEventListener('click', function(){ if(!state.spinning) buildPool(); });
  $('againBtn').addEventListener('click', spin);
  spinBtn.addEventListener('click', spin);

  function pickIndex(n){
    var i = Math.floor(Math.random()*n);
    if(n > 1 && i === state.lastPick) i = (i + 1 + Math.floor(Math.random()*(n-1))) % n;
    state.lastPick = i;
    return i;
  }

  function spin(){
    if(state.spinning || !state.pool.length) return;
    state.spinning = true;
    spinBtn.disabled = true;
    spinBtn.textContent = '…';
    resetResult();

    var n = state.pool.length, seg = 360/n;
    var i = pickIndex(n);
    var base = (360 - (i + 0.5)*seg) % 360;
    var turns = Math.ceil((state.rotation + 1800 - base)/360);
    var target = base + 360*turns;
    state.rotation = target;
    rotor.style.transform = 'rotate(' + target + 'deg)';

    var settled = false;
    var finish = function(){
      if(settled) return;
      settled = true;
      rotor.removeEventListener('transitionend', finish);
      clearTimeout(timer);
      result.classList.remove('hit');
      void result.offsetWidth;           /* 强制重排，让入场动效每次都跑 */
      resultName.textContent = state.pool[i];
      resultMeta.textContent = '别纠结了，就它。';
      result.classList.add('hit');
      state.spinning = false;
      spinBtn.disabled = false;
      spinBtn.textContent = '转！';
    };
    rotor.addEventListener('transitionend', finish);
    var timer = setTimeout(finish, 5600);
  }

  /* 每半分钟对一次表；自动模式下跨了餐点就自己换池 */
  var lastAuto = autoMeal();
  setInterval(function(){
    var d = new Date();
    $('clock').textContent = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
    var now = autoMeal();
    if(state.meal === 'auto' && now !== lastAuto && !state.spinning){
      lastAuto = now;
      refresh();
    }
  }, 30000);

  refresh();
})();
</script>
<script src="../assets/ambience.js"></script>
<script src="../assets/bgm.js"></script>
</body>
