name: Deploy NICE.BLOG 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
      - name: Stage — 水墨主站为根，React 2.0 挂载到 /2.0/
        run: |
          mkdir -p site/2.0
          cp -r index.html 404.html CNAME assets ink tools what-to-eat.html site/
          cp -r app/dist/. site/2.0/
      - name: Guard — 双站面完整性校验
        run: |
          test -f site/CNAME || { echo "CNAME missing"; exit 1; }
          test -f site/404.html || { echo "404.html missing"; exit 1; }
          test -f site/index.html || { echo "ink index missing"; exit 1; }
          test -f site/tools/json.html || { echo "tools/json.html missing"; exit 1; }
          test -f site/tools/commands.html || { echo "tools/commands.html missing"; exit 1; }
          test -f site/tools/what-to-eat.html || { echo "tools/what-to-eat.html missing"; exit 1; }
          test -f site/2.0/index.html || { echo "react index missing"; exit 1; }
          test -f site/2.0/tools/json.html || { echo "2.0 tools missing"; exit 1; }
          echo "both surfaces OK"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
