name: Deploy NICE.BLOG 2.0

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
      - name: Guard — CNAME / 404 / legacy tools must exist
        run: |
          test -f app/dist/CNAME || { echo "CNAME missing"; exit 1; }
          test -f app/dist/404.html || { echo "404.html missing"; exit 1; }
          test -f app/dist/tools/json.html || { echo "tools/json.html missing"; exit 1; }
          test -f app/dist/tools/commands.html || { echo "tools/commands.html missing"; exit 1; }
          test -f app/dist/tools/what-to-eat.html || { echo "tools/what-to-eat.html missing"; exit 1; }
          echo "legacy surface OK"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
