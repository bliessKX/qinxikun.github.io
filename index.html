<style>
:root{
  --bg:#faf9f6;

  --ink:#1b1a18;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{

img{display:block;max-width:100%}

/* ---------- 左侧目录 ---------- */
.side{
  border-right:1px solid var(--line);
  padding:30px 20px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.01em}
.brand small{
  display:block;font-family:var(--sans);font-size:12px;
  color:var(--muted);font-weight:400;letter-spacing:.03em;margin-top:5px;
}
.dir-title{
  margin:32px 0 4px;font-size:12px;letter-spacing:.16em;
  color:var(--muted);text-transform:uppercase;
  border-top:1px solid var(--line);padding-top:18px;
}
.toc-list{list-style:none;margin:0;padding:0}
.toc-link{
  display:block;padding:8px 10px 8px 13px;
  border-left:2px solid transparent;margin-left:-2px;
  color:var(--ink);transition:background .2s,border-color .2s;
}
.toc-link:hover{background:rgba(0,0,0,.035)}
.toc-link.active{background:rgba(156,59,42,.06);border-left-color:var(--accent);font-weight:600}
.toc-link .t-idx{
  font-family:var(--serif);color:var(--muted);font-size:13px;
  margin-right:9px;font-variant-numeric:tabular-nums;
}
.toc-link.active .t-idx{color:var(--accent)}
.toc-link .t-cat{
  display:block;font-size:11px;color:var(--muted);
  margin-top:3px;letter-spacing:.02em;font-weight:400;
}
.music{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.music button{
  all:unset;cursor:pointer;font-size:13px;color:var(--muted);
  display:inline-flex;align-items:center;gap:8px;
}
.music button:hover{color:var(--ink)}
.music .dot{
  width:7px;height:7px;border-radius:50%;background:#c8c2b6;
  display:inline-block;transition:background .25s;
}
.music.on .dot{background:var(--accent)}

/* ---------- 右侧内容 ---------- */
.main{padding:42px 56px 80px;max-width:840px}
.page-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:32px}
.page-head h1{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.01em;margin:0}
.page-head p{color:var(--muted);margin:8px 0 0;font-size:14px}

.note-cat{font-size:13px;color:var(--accent);letter-spacing:.04em;margin:0 0 10px}
.note-title{font-family:var(--serif);font-size:27px;font-weight:700;line-height:1.35;margin:0 0 8px}
.note-meta{color:var(--muted);font-size:13px;margin:0 0 26px}
.note-toc{
  background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:16px 18px;margin:0 0 30px;
}
.note-toc .h{
  font-size:12px;letter-spacing:.14em;color:var(--muted);
  text-transform:uppercase;margin-bottom:10px;
}
.note-toc ol{margin:0;padding-left:20px;font-size:14px;line-height:1.95}
.note-body p{margin:0 0 18px;line-height:1.85}
.note-foot{
  margin-top:34px;padding-top:22px;border-top:1px solid var(--line);

}
.read-link{
  font-size:14px;font-weight:600;color:var(--accent);
  border:1px solid var(--line);padding:9px 16px;border-radius:8px;transition:.2s;
}
.read-link:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- 关于 ---------- */
.about{margin-top:64px;border-top:1px solid var(--line);padding-top:34px}
.about h2{font-family:var(--serif);font-size:22px;font-weight:700;margin:0 0 12px}
.about p{color:#524e47;max-width:60ch;margin:0}
.about a.mail{color:var(--accent);border-bottom:1px solid var(--line)}
footer{

@media (max-width:880px){
  .layout{grid-template-columns:1fr}

  .main{padding:32px 22px 60px;max-width:none}
}

  html{scroll-behavior:auto}

<script>
var BASE = 'https://blog.csdn.net/m0_68970560/article/details/';
var NOTES = [
  {id:'167390328', title:'微信小程序多设备登录：多端共存、同端互斥完整方案', cat:'鉴权之道', date:'2026-10-10',
    toc:['场景与设备识别','双 Token 与 Redis','单 Token 瞬间剔除','选型与结论'],
    paras:[
      '场景是同一用户要在 iPad、手机、电脑三端小程序同时在线：多端共存，同类型设备后登录踢掉先登录的。技术栈 Spring Security + JWT + Redis，前提是把设备码 deviceType 写进 JWT payload。',
      '小程序端用 wx.getDeviceInfo 拿 platform 与 model，映射成 IPHONE、IPAD、PC。有个边界要注意：platform 为 ios 时 iPhone 和 iPad 不分家，只能靠 model 判断；新机型 model 返回 unknown 会回落到 IPHONE，小概率误踢。',
      '双 Token 方案里 Redis 只存 RefreshToken，按 login:IPHONE:123 这样的 key 分端覆盖。同端再登录会覆盖旧的 RefreshToken，但旧设备还能撑到 AccessToken 过期，最长三十分钟，这就是俗称的假在线。',
      '单 Token 把 Token 本身存 Redis、每次请求比对，覆盖即踢，下一次请求就 401，代价是 Redis 成了强依赖。选型结论：要瞬间踢人用单 Token，要高安全能接受延迟用双 Token，两者都要就双 Token 加 WebSocket 推送。'
    ]},
  {id:'167668600', title:'JDK 新特性详解', cat:'语言之记', date:'2026-10-12',
    toc:['Record 记录类','密封类 Sealed','模式匹配','版本特性脉络'],
    paras:[
      '这篇按语言特性梳理 JDK 8 到 21 的演进，重点讲 Record、密封类与模式匹配三块，而不是罗列版本号。',
      'Record 解决 DTO、VO 手写 getter、equals、hashCode、toString 的样板代码；它是 final、字段 private final，天然不可变，适合做值对象。需要可变性或继承时，Lombok 的 @Data 仍是实用选择。',
      '密封类用 sealed 加 permits 明确允许哪些子类，子类只能是 final、sealed、non-sealed 三者之一。配合 JDK 21 的 switch 模式匹配，编译器能做穷尽性检查，漏一个分支直接编译报错。',
      'instanceof 模式匹配在 JDK 16 正式，switch 模式匹配与 record 模式在 JDK 21 正式；JDK 17 上后两者仍要加 --enable-preview。虚拟线程虽是 JDK 21 的重点，多数企业还没开始用。'
    ]},
  {id:'167386677', title:'游标分页和偏移量详解', cat:'数据之学', date:'2026-10-09',
    toc:['偏移量分页','游标分页','对比与选型','MyBatis-Plus 落地'],
    paras:[
      '分页要解决的只有一个问题：下一页从哪里开始。偏移量用 LIMIT 加 OFFSET 回答「跳过多少条」，游标用「上一页最后一条的排序值」回答「从哪条之后」。',
      'OFFSET 一百万时，MySQL 必须先扫到第一百万零十行再丢掉前一百万行，页码越深越慢；翻页过程中有插入删除，还会出现重复或漏数据，也就是数据漂移。',
      '游标写成 WHERE id 小于上一页末值、ORDER BY id DESC、LIMIT 10，靠索引直接定位，扫描量恒定为每页条数，也不会漂移。代价是不能随机跳页、不能算总页数，排序字段要唯一且有序。',
      '选型很实际：后台管理表格要跳页用偏移量，信息流、无限滚动、开放 API 用游标。折中做法是前几页偏移量、超过一定深度改游标；MyBatis-Plus 默认走偏移量，要用游标得手写 QueryWrapper 并绕开分页插件。'
    ]},
  {id:'167362562', title:'四千万级别的 MySQL 插入和查询的性能优化', cat:'性能之法', date:'2026-10-09',
    toc:['业务场景与 EXPLAIN','隐式转换根因','不走索引清单','修复与沉淀'],
    paras:[
      '桥梁日常巡查每天新增记录，还要实时算巡查率；评估表建记录时得回查千万级桥梁主表。先跑 EXPLAIN 看扫描行数和实际用的索引，发现 SQL 根本没按预期走索引。',
      '用 USE INDEX 强制指定索引后，耗时从五分钟降到三分钟，只快一半——说明瓶颈不在优化器选错索引，而在查询结构本身。最终定位是隐式类型转换：索引列是 varchar，传入的却是 int。',
      'MySQL 比较时倾向把两边都转成数字，等于在索引列上套了 CAST，B+ 树有序性失效，只能全索引扫描再回表。修法很朴素：参数传字符串，或把字段类型改成与业务语义一致的 BIGINT，从源头消除转换。',
      '真正的慢点还在巡查率：要扫当天全部巡查记录再 join 桥梁主表算比值。沉淀下来的经验是索引存在不等于索引可用，先查类型一致，再看查询结构，这两条比调参数管用。'
    ]},
  {id:'164742441', title:'LangGraph 框架简单解析', cat:'智体之思', date:'2026-09-09',
    toc:['State / Node / Edge','StateGraph 与编译','检查点与 HITL','多智能体与总结'],
    paras:[
      'LangGraph 是 LangChain 团队的底层编排框架，把 Agent 工作流抽象成有向图：State 是共享状态快照，Node 是干活的节点函数，Edge 决定下一步往哪走。',
      '用 StateGraph 定义 schema、注册节点、连普通边与条件边，最后 compile 之后才能运行。执行模型受 Pregel 启发，按超步推进，并行节点落在同一个超步里。',
      '生产级能力靠持久化层：Checkpointer 按 thread_id 保存每一步检查点，撑起容错与记忆；interrupt_before 与 interrupt_after 实现人工介入，时间旅行允许重放或分叉历史状态。',
      '多智能体用 Supervisor 模式与子图机制组织。相对线性链，核心变化是控制流支持分支、循环、并行，状态显式定义、可观测，而不是一个黑盒。'
    ]},
  {id:'160253124', title:'Shiro 框架简单解析', cat:'权限之制', date:'2026-09-08',
    toc:['Shiro 是什么','三大组件','Realm 数据源','登录与授权流程'],
    paras:[
      'Shiro 是轻量级 Java 安全框架：简单、易上手、不依赖 Spring，可独立运行，提供认证、授权、加密与会话管理。它没有默认的 CSRF、OAuth2、OIDC，需要自己集成，换来的是可以嵌进任何程序。',
      '核心是三大组件一条链：Subject 承载当前用户的全部信息，SecurityManager 是全局唯一的调度中心，认证、授权、会话、缓存全由它转发；Realm 是 Shiro 与安全数据之间的通道。',
      'Realm 不永久存数据，只负责搬：doGetAuthenticationInfo 取认证信息（用户名加凭证），doGetAuthorizationInfo 取授权信息（角色与细粒度权限）。密码建议哈希加盐后用 HashedCredentialsMatcher 比对。',
      '登录走 Subject.login(token) → SecurityManager → Authenticator 遍历 Realm → 比对密码 → 生成上下文存 Session；授权同理走 Authorizer。在养护平台里管会话与菜单权限，踩过最大的坑是缓存：基础数据可进 EhCache 与 Redis，业务数据必须回库。'
    ]},
  {id:'164575559', title:'TCP 和 UDP 的区别', cat:'网络之基', date:'2026-09-08',
    toc:['三次握手四次挥手','全双工与可靠性','丢包与延迟','业务选型'],
    paras:[
      'TCP 有连接、UDP 无连接，这在协议文本里写得明明白白：RFC 793 专设 Connection Establishment 与 Termination 两章，规定 SYN、ACK、FIN 与十一种状态变迁；RFC 768 全文三页，通篇没有 Connection 一词。',
      '三次握手交换 SYN 与 ACK，四次挥手交换 FIN 与 ACK；UDP 头部连这些标志位都没有，硬件上就不支持握手。TCP 全双工，两个方向各有独立序列号与窗口通知，速率互不影响。',
      'TCP 靠校验和、序列号、确认应答与重传保证可靠，代价是头部开销与拥塞降速；面向字节流没有边界，接收端一次读到多少不确定。UDP 不保证顺序与重传，头部小、支持广播组播，拥堵时绝不降速。',
      '一句话总结：TCP 把物理丢包转化成延迟剧增，UDP 把丢包转化成数据缺失，延迟几乎不受丢包影响。业务上网页与文件传输怕丢包用 TCP，实时游戏、直播怕延迟用 UDP。'
    ]},
  {id:'164332676', title:'Python 装饰器是什么', cat:'语言之记', date:'2026-09-07',
    toc:['装饰器是什么','闭包与语法糖','带参数装饰器','工程要点'],
    paras:[
      'Java 的装饰器是设计模式：用类包装对象，运行时动态组合功能；Python 装饰器走另一条路——用函数包装函数，定义时静态替换功能，本质是语法糖。一句话：不修改原函数和调用方式，给函数额外加一层功能。',
      '从加日志说起：直接改函数会侵入原逻辑，抽成接收函数、嵌套 wrapper、返回 wrapper 的高阶函数就干净了。@cat 语法糖只是省掉 say = cat(say) 这步赋值。',
      '写法三件事：wrapper 用 *args、**kwargs 通吃参数，有返回值必须 return；@functools.wraps 保留原函数的 __name__ 与 __doc__；带参数的装饰器要三层嵌套，多个装饰器叠加时离函数最近的先执行。',
      '工程里常用来做路由、权限校验、日志、计时、缓存，作用类似 Java 的 AOP 切面。记一句就够：装饰器 = 闭包 + @ 语法糖。'
    ]},
  {id:'164109415', title:'多数据源切换与多数据库适配', cat:'存储之法', date:'2026-08-27',
    toc:['两个问题的边界','方案对比','DatabaseIdProvider','@DS 落地'],
    paras:[
      '两个问题常被混谈：项目要同时连多个数据库，是多数据源切换；一套代码要部署到 MySQL、达梦、SQL Server 等不同环境，是多数据库适配。前者选连接，后者选方言。',
      '多数据源主流是 mybatis-plus 的 dynamic-datasource：AOP 加 @DS 注解运行时切库，配置清晰、侵入小，适合读写分离与多租户分库。Spring 原生 AbstractRoutingDataSource 灵活但实现繁琐；静态多源配置适合模块完全隔离的简单项目。',
      '多数据库适配用 DatabaseIdProvider：VendorDatabaseIdProvider 把 MySQL、DM、SQL Server 映射成 mysql、dm、sqlserver 标识，XML 里同名 SQL 片段配不同 databaseId，或用 if 判断 _databaseId 写方言，没写 databaseId 的默认当 MySQL。',
      '落地经验：连多个库用 @DS（比如权限过滤连 SYS 库），换数据库品牌用 DatabaseIdProvider。LIKE 拼接这类方言差异写成同名片段最稳。'
    ]},
  {id:'163942173', title:'Get 请求和 Post 请求的区别', cat:'网络之基', date:'2026-08-21',
    toc:['语义与差异','HTTP/1.1 六车道','选型原则','OPTIONS 预检'],
    paras:[
      '后端前端联调常因不按规范来而拿不到正确信息，这在 HTTP/1.1 下尤其明显。浏览器层面：GET 拿资源，参数在 URL、可缓存、可收藏、幂等安全；POST 提交资源，参数在 Body、不缓存、不留历史。',
      'HTTP/1.1 同一域名最多六个 TCP 连接，四十个请求来的时候前六个占道、其余排队，谁先完成谁的车道立刻补位。所以页面卡往往不是服务器慢，是排队；HTTP/2 的多路复用才解开这个结。',
      '取舍原则：用 GET 拿数据，用 POST 改数据。查询搜索、幂等无副作用、参数短、要缓存的用 GET；数据量大、带敏感信息、有副作用、传 JSON 或文件的用 POST。',
      'POST 带 JSON 会触发 OPTIONS 预检，请求直接翻倍，还吃连接、线程与带宽。最实用的优化是 Access-Control-Max-Age 缓存预检结果；预检虽不执行业务，也防 CSRF 与数据泄露。'
    ]}
];

      '<p class="note-cat">' + n.cat + '</p>' +
      '<h2 class="note-title">' + n.title + '</h2>' +
      '<p class="note-meta">' + n.date + ' · 共 ' + n.toc.length + ' 节</p>' +
      '<div class="note-toc"><div class="h">目录</div><ol>' +
        n.toc.map(function(t){ return '<li>' + t + '</li>'; }).join('') +
      '</ol></div>' +
      '<div class="note-body">' +
        n.paras.map(function(p){ return '<p>' + p + '</p>'; }).join('') +
      '</div>' +
      '<div class="note-foot">' +
        '<a class="read-link" href="' + BASE + n.id + '" target="_blank" rel="noopener">阅读原文 ↗</a>' +
        '<span class="note-meta">来自 CSDN</span>' +
      '</div>';
    document.querySelectorAll('.toc-link').forEach(function(a){
      a.classList.toggle('active', +a.dataset.i === i);
    });
    document.title = n.title + ' — NICE.BLOG';
  }

  function fromHash(){
    var m = location.hash.match(/#\/(\d+)/);
    var i = m ? +m[1] : 1;
    if(i < 1 || i > NOTES.length) i = 1;
    render(i);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();

  /* ---------- 背景乐：稻香优先，合成底乐兜底 ---------- */
  var audio = document.getElementById('bgm');
  var btn = document.getElementById('bgmBtn');
  var wrap = document.getElementById('musicWrap');
  var label = document.getElementById('musicLabel');
  var TRACKS = [
    { src: 'assets/daoxiang.mp3', name: '稻香' },
    { src: 'assets/summer-field.wav', name: '夏夜稻田' }
  ];
  var idx = 0;
  var BG_KEY = 'nice-bgm';

  function loadTrack(){
    if(idx >= TRACKS.length) return;
    audio.src = TRACKS[idx].src;
    audio.volume = 0.34;
    audio.load();
  }
  audio.addEventListener('error', function(){ idx++; loadTrack(); });
  loadTrack();

  function setUI(on){
    wrap.classList.toggle('on', on);
    label.textContent = on ? ('播放中 · ' + TRACKS[idx].name) : '背景音乐';
    btn.setAttribute('aria-label', on ? '暂停背景音乐' : '播放背景音乐');
  }
  function play(){
    var p = audio.play();
    if(p && p.then){ p.then(function(){ setUI(true); }).catch(function(){ setUI(false); }); }
    else { setUI(true); }
    try{ localStorage.setItem(BG_KEY,'1'); }catch(e){}
  }
  function pause(){
    audio.pause();
    setUI(false);
    try{ localStorage.setItem(BG_KEY,'0'); }catch(e){}
  }
  btn.addEventListener('click', function(){
    if(audio.paused){ play(); } else { pause(); }
  });

  var want = false;
  try{ want = localStorage.getItem(BG_KEY) === '1'; }catch(e){}
  if(want){
    var resume = function(){
      play();
      document.removeEventListener('pointerdown', resume);
      document.removeEventListener('keydown', resume);
    };
    document.addEventListener('pointerdown', resume);
    document.addEventListener('keydown', resume);
  }
})();
</script>
</body>
</html>
